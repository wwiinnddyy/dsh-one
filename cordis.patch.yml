# dsh-one bundle patch: the 0.3 row and its settings.
#
# The core row mounts the Engine, the Effects queue, the Executor and the
# workbench client. The client is delivered through `dsh.client` in package.json,
# not as a separate row.
- insert:
    - id: dsh-one
      name: 'dsh-one'
      config:
        displayName: 鲸宝
        # The assistant is the user's proxy; its tools execute. Set observe to
        # record intended work without creating tickets.
        mode: active
        assistantHomeRoot: ''
        allowedWorkspaceRoots: []
        maxWorkers: 4
        commandTimeoutMs: 30000
